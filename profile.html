<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #333333;
            margin: 10px 0 5px 0;
        }
        h2 {
            font-size: 16px;
            color: #007bff;
            font-weight: normal;
            margin: 0 0 15px 0;
        }
        p {
            font-size: 14px;
            color: #666666;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .links a {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background-color: #333333;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .links a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="profile-card">

        <img src="https://placeholder.com" alt="Profile Picture" class="profile-pic">
        
        <h1>Your Name</h1>
        <h2>GitHub Developer</h2>
        
        <p>Hi, I'm a developer learning to build projects and earn badges on GitHub. Welcome to my personal profile page!</p>
        
        <div class="links">

            <a href="https://github.com" target="_blank">View GitHub Profile</a>
        </div>
    </div>

</body>
</html>
